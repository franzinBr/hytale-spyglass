name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable tag to recover (vX.Y.Z)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      hytale-version: ${{ steps.release.outputs.hytale-version }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Validate tag and source versions
        id: release
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || {
            echo "Release tag must be stable SemVer (vMAJOR.MINOR.PATCH): $RELEASE_TAG" >&2
            exit 1
          }
          git show-ref --verify --quiet "refs/tags/$RELEASE_TAG" || {
            echo "The requested tag does not exist: $RELEASE_TAG" >&2
            exit 1
          }
          version="${RELEASE_TAG#v}"
          property_version="$(sed -n 's/^pluginVersion=//p' gradle.properties)"
          hytale_version="$(sed -n 's/^hytaleVersion=//p' gradle.properties)"
          [[ "$property_version" == "$version" ]] || {
            echo "Tag version ($version) differs from pluginVersion ($property_version)." >&2
            exit 1
          }
          [[ -n "$hytale_version" ]] || { echo "hytaleVersion is missing." >&2; exit 1; }
          grep -Fq '"Version": "${version}"' src/main/resources/manifest.json
          grep -Fq '"ServerVersion": "${hytaleVersionConstraint}"' src/main/resources/manifest.json
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "hytale-version=$hytale_version" >> "$GITHUB_OUTPUT"

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Set up Java 25
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Test and build once
        run: ./gradlew clean build --no-daemon --stacktrace

      - name: Validate distributable
        env:
          VERSION: ${{ steps.release.outputs.version }}
          HYTALE_VERSION: ${{ steps.release.outputs.hytale-version }}
        run: |
          set -euo pipefail
          jar="build/libs/Spyglass-$VERSION.jar"
          mapfile -t candidates < <(find build/libs -maxdepth 1 -type f -name 'Spyglass-*.jar' -print)
          [[ ${#candidates[@]} -eq 1 && "${candidates[0]}" == "$jar" ]] || {
            echo "Expected exactly one distributable named $jar; found: ${candidates[*]:-none}" >&2
            exit 1
          }
          manifest="$(unzip -p "$jar" manifest.json)"
          jq -e --arg version "$VERSION" --arg server "=$HYTALE_VERSION" \
            '.Version == $version and .ServerVersion == $server' <<< "$manifest" >/dev/null || {
            echo "Processed manifest version or ServerVersion does not match the release." >&2
            exit 1
          }
          (cd build/libs && sha256sum "Spyglass-$VERSION.jar" > "Spyglass-$VERSION.jar.sha256")

      - name: Upload validated release artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: spyglass-release-${{ steps.release.outputs.version }}
          path: |
            build/libs/Spyglass-${{ steps.release.outputs.version }}.jar
            build/libs/Spyglass-${{ steps.release.outputs.version }}.jar.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Summarize build
        env:
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          checksum="$(cut -d ' ' -f1 "build/libs/Spyglass-$VERSION.jar.sha256")"
          printf '### Validated release artifact\n\n- Tag: `%s`\n- SHA-256: `%s`\n' "$TAG" "$checksum" >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download validated artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: spyglass-release-${{ needs.build.outputs.version }}
          path: dist

      - name: Verify downloaded checksum
        working-directory: dist
        run: sha256sum --check "Spyglass-${{ needs.build.outputs.version }}.jar.sha256"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.build.outputs.tag }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          jar="dist/Spyglass-$VERSION.jar"
          checksum_file="$jar.sha256"
          checksum="$(cut -d ' ' -f1 "$checksum_file")"

          release_json="$(gh api "repos/$GH_REPO/releases/tags/$TAG" 2>/dev/null || true)"
          if [[ -n "$release_json" ]]; then
            published_assets="$(mktemp -d)"
            gh release download "$TAG" --pattern "Spyglass-$VERSION.jar*" --dir "$published_assets"
            cmp --silent "$checksum_file" "$published_assets/Spyglass-$VERSION.jar.sha256" || {
              echo "The published GitHub Release has a different checksum; refusing to replace it." >&2
              exit 1
            }
            (cd "$published_assets" && sha256sum --check "Spyglass-$VERSION.jar.sha256")
            printf '### Release already complete\n\n- GitHub: %s\n- SHA-256: `%s`\n' \
              "$(jq -r '.html_url' <<< "$release_json")" "$checksum" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # With assets passed to `gh release create`, the CLI creates an
          # internal draft, uploads every asset, and only then publishes it.
          # This avoids having to discover or update an externally visible draft.
          gh release create "$TAG" "$jar" "$checksum_file" \
            --verify-tag \
            --generate-notes \
            --title "Spyglass $VERSION"
          release_url="$(gh release view "$TAG" --json url --jq .url)"
          printf '### Published release\n\n- GitHub: %s\n- JAR: `Spyglass-%s.jar`\n- SHA-256: `%s`\n' \
            "$release_url" "$VERSION" "$checksum" >> "$GITHUB_STEP_SUMMARY"
