name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Set up Java 25
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Test and build
        run: ./gradlew clean build --no-daemon --stacktrace

      - name: Read artifact version
        if: success()
        id: version
        run: |
          set -euo pipefail
          version="$(sed -n 's/^pluginVersion=//p' gradle.properties)"
          expected="build/libs/Spyglass-$version.jar"
          mapfile -t candidates < <(find build/libs -maxdepth 1 -type f -name 'Spyglass-*.jar' -print)
          [[ ${#candidates[@]} -eq 1 && "${candidates[0]}" == "$expected" ]] || {
            echo "Expected exactly one distributable named $expected; found: ${candidates[*]:-none}" >&2
            exit 1
          }
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-reports-${{ github.run_id }}
          path: build/reports/tests/
          if-no-files-found: error
          retention-days: 7

      - name: Upload distributable JAR
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: spyglass-ci-${{ github.sha }}
          path: build/libs/Spyglass-${{ steps.version.outputs.value }}.jar
          if-no-files-found: error
          retention-days: 7
